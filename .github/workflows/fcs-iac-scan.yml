name: "CrowdStrike FCS IaC Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fcs-iac-scan:
    name: "FCS IaC Security Scan"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create scan results directory
        run: mkdir -p ./scan-results

      - name: Run FCS IaC Scan
        id: fcs
        uses: crowdstrike/fcs-action@v4.0.1
        with:
          falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
          falcon_region: ${{ vars.FALCON_REGION }}
          scan_type: iac
          path: './vulnerable-iac'
          project_name: 'fcs-iac-test-lab'
          severities: 'critical,high,medium,informational'
          fail_on: 'critical=1,high=5'
          report_formats: 'sarif,json'
          output_path: './scan-results'
          upload_results: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      # -----------------------------------------------
      # DIAGNOSTIC: Dump everything we can find
      # -----------------------------------------------
      - name: DIAGNOSTIC - Full filesystem search
        if: always()
        run: |
          echo "====== ALL FCS ACTION OUTPUTS ======"
          echo "exit-code:  ${{ steps.fcs.outputs.exit-code }}"
          echo "sarif-file: ${{ steps.fcs.outputs.sarif-file }}"
          echo "json-file:  ${{ steps.fcs.outputs.json-file }}"
          echo "output-path: ${{ steps.fcs.outputs.output-path }}"
          echo ""
          echo "====== scan-results/ CONTENTS ======"
          ls -laR ./scan-results/ 2>/dev/null || echo "Directory missing"
          echo ""
          echo "====== FIND ALL REPORT FILES ======"
          find . \( \
            -name "*.sarif" \
            -o -name "*.sarif.json" \
            -o -name "*.json" \
            -o -name "*.csv" \
            -o -name "*.xml" \
            -o -name "*.html" \
            -o -name "*.txt" \
          \) \
          ! -path "./.git/*" \
          ! -path "./vulnerable-iac/*" \
          2>/dev/null
          echo ""
          echo "====== FIND ALL NEW FILES (modified in last 60s) ======"
          find . -newer ./scan-results \
            ! -path "./.git/*" \
            -type f 2>/dev/null
          echo ""
          echo "====== HOME DIR ======"
          ls -la ~/
          echo ""
          echo "====== /tmp CONTENTS ======"
          ls -la /tmp/ 2>/dev/null

      - name: Upload ALL scan artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcs-scan-results
          # Upload everything for inspection
          path: |
            ./scan-results/
            /tmp/*.sarif
            /tmp/*.json
          if-no-files-found: warn

      - name: Scan Summary
        if: always()
        run: |
          echo "==========================================="
          echo "  FCS IaC Scan Complete"
          echo "  Exit Code: ${{ steps.fcs.outputs.exit-code }}"
          echo "==========================================="
          if [ "${{ steps.fcs.outputs.exit-code }}" != "0" ]; then
            echo "SCAN FAILED — Critical/High vulnerabilities detected!"
            exit 1
          fi
