name: "CrowdStrike FCS IaC Scan"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fcs-iac-scan:
    name: "FCS IaC Security Scan"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------
      # FIX 1: Pre-create the output directory
      # Ensures the path exists before fcs-action runs
      # -------------------------------------------
      - name: Create scan results directory
        run: mkdir -p ./scan-results

      - name: Run FCS IaC Scan
        id: fcs
        uses: crowdstrike/fcs-action@v4.0.1
        with:
          falcon_client_id: ${{ vars.FALCON_CLIENT_ID }}
          falcon_region: ${{ vars.FALCON_REGION }}
          scan_type: iac
          path: './vulnerable-iac'
          project_name: 'fcs-iac-test-lab'
          severities: 'critical,high,medium,informational'
          fail_on: 'critical=1,high=5'
          report_formats: 'sarif,json'
          # FIX 2: Remove trailing slash — some action versions
          # are sensitive to path formatting
          output_path: './scan-results'
          upload_results: true
        env:
          FALCON_CLIENT_SECRET: ${{ secrets.FALCON_CLIENT_SECRET }}

      # -------------------------------------------
      # FIX 3: Enhanced debug step — run BEFORE
      # upload attempts to confirm file existence
      # -------------------------------------------
      - name: List scan result files
        if: always()
        run: |
          echo "=== Contents of ./scan-results/ ==="
          ls -la ./scan-results/ 2>/dev/null || echo "Directory not found"
          echo ""
          echo "=== Recursive search for SARIF files ==="
          find . -name "*.sarif" -o -name "*.sarif.json" 2>/dev/null
          echo ""
          echo "=== FCS Action outputs ==="
          echo "exit-code: ${{ steps.fcs.outputs.exit-code }}"
          echo "sarif-file: ${{ steps.fcs.outputs.sarif-file }}"

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcs-scan-results
          path: ./scan-results/
          if-no-files-found: warn

      # -------------------------------------------
      # FIX 4: Corrected condition — upload SARIF
      # always() so it runs regardless of scan result.
      # Use output variable if fcs-action exposes it,
      # otherwise fall back to directory glob.
      # -------------------------------------------
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          # FIX 5: Use the action's output for explicit path
          # Falls back to directory scan if output is empty
          sarif_file: ${{ steps.fcs.outputs.sarif-file || './scan-results' }}
        # FIX 6: Don't fail the workflow if no SARIF found
        continue-on-error: true

      - name: Scan Summary
        if: always()
        run: |
          echo "==========================================="
          echo "  FCS IaC Scan Complete"
          echo "  Exit Code: ${{ steps.fcs.outputs.exit-code }}"
          echo "==========================================="
          if [ "${{ steps.fcs.outputs.exit-code }}" != "0" ]; then
            echo "SCAN FAILED — Critical/High vulnerabilities detected!"
            echo "Results uploaded to Falcon Console (project: fcs-iac-test-lab)"
            echo "Check the 'fcs-scan-results' artifact for local reports."
            exit 1
          else
            echo "SCAN PASSED — No critical issues found."
          fi
